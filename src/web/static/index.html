<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CARLA Web Demo</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
</head>
<body>
  <canvas id="starfield" class="starfield" aria-hidden="true"></canvas>
  <div class="layout">
    <header class="topbar">
      <div class="brand">
        <span class="dot"></span>
        <div>
          <div class="title">CARLA Visual Localization</div>
          <div class="subtitle">Live demo control + OSM map</div>
        </div>
      </div>
      <div class="status" id="status">Disconnected</div>
    </header>

    <div id="toast-stack" class="toast-stack" aria-live="polite"></div>

    <main class="main">
      <section class="panel map-panel">
        <div class="pulse-ring" id="pulse-ring"></div>
        <div id="map" class="map"></div>
        <div class="legend">
          <span class="legend-item"><span class="legend-dot gt"></span> Ground Truth</span>
          <span class="legend-item"><span class="legend-dot est"></span> Estimated</span>
        </div>
        <div class="map-info">
          <div class="info-title">Latest Localization</div>
          <div class="info-grid">
            <div>
              <div class="info-label">Estimated (lat, lon)</div>
              <div id="info-est" class="info-value">--</div>
            </div>
            <div>
              <div class="info-label">Ground Truth (lat, lon)</div>
              <div id="info-gt" class="info-value">--</div>
            </div>
            <div>
              <div class="info-label">Error (meters)</div>
              <div id="info-error" class="info-value">--</div>
            </div>
          </div>
        </div>
        <div class="history-panel">
          <div class="info-title">Last 5 Localizations</div>
          <div id="history-list" class="history-list"></div>
        </div>
      </section>

      <section class="panel control-panel">
        <h2>Controls</h2>
        <div class="form-row">
          <label for="carla-host">CARLA Host</label>
          <input id="carla-host" value="127.0.0.1" />
        </div>
        <div class="form-row">
          <label for="carla-port">CARLA Port</label>
          <input id="carla-port" type="number" value="2000" />
        </div>
        <div class="form-row">
          <label for="loc-host">Localization Host (placeholder)</label>
          <input id="loc-host" value="127.0.0.1" />
        </div>
        <div class="form-row">
          <label for="loc-port">Localization Port</label>
          <input id="loc-port" type="number" value="5555" />
        </div>
        <div class="form-row">
          <label for="web-rate">Web Rate (Hz)</label>
          <input id="web-rate" type="number" value="6" step="1" />
        </div>
        <div class="advanced-panel is-open">
          <div class="form-row toggle">
            <input id="no-preview" type="checkbox" />
            <label for="no-preview">Disable Pygame preview</label>
          </div>
          <div class="divider"></div>
          <div class="form-row">
            <label for="carla-exe">CARLA Executable Path</label>
            <input id="carla-exe" placeholder="C:\CARLA\CarlaUE4.exe" />
          </div>
          <div class="form-row">
            <label for="carla-args">CARLA Extra Args (optional)</label>
            <input id="carla-args" placeholder="-RenderOffScreen" />
          </div>
        </div>
        <div class="btn-row">
          <button id="start-btn" class="btn primary">Start</button>
          <button id="stop-btn" class="btn">Stop</button>
        </div>
        <button id="carla-btn" class="btn ghost">Launch CARLA Simulator</button>
        <div class="note">
          Autopilot is enabled. Use L to localize; results appear here.
        </div>
      </section>
    </main>
  </div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="/static/app.js"></script>
</body>
</html>
